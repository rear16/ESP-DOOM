name=ESP32-DOOM
version=1.0.0
author=Rear Labs <removed>
maintainer=Rear Labs <removed>
sentence=Doom engine (doomgeneric) ported to ESP32/Arduino, with a custom PCM mixer, EQ and chiptune music synth.
paragraph=Runs the Doom engine on ESP32-S3 boards with PSRAM. You provide three small interfaces (display, input, PCM audio) and a WAD file on SD/LittleFS; the library drives the game loop, renderer and its own software audio mixer (SFX + synthesized MUS music, with a runtime-tunable high-pass/limiter chain built for small speakers). Requires a board with at least ~6MB of free PSRAM today; see README for the memory budget and roadmap toward smaller targets.
category=Display
url=https://github.com/rear16/ESP32-DOOM
architectures=esp32
includes=doomgeneric.h
depends=Arduino_GFX_Library